# Local Ghostfolio for developing and testing the importer.
#
#   yarn dev:up      start (first run pulls the images and migrates the database)
#   yarn dev:logs    follow logs
#   yarn dev:down    stop and delete all data
#
# Ghostfolio is then available at http://localhost:3333. See the Development section of the README.
# The credentials in ghostfolio.env are for this throwaway local instance only.
name: ghostfolio-importer-dev

services:
    ghostfolio:
        image: docker.io/ghostfolio/ghostfolio:3.87.0
        restart: unless-stopped
        init: true
        env_file:
            - ghostfolio.env
        ports:
            - 3333:3333
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'curl -f http://localhost:3333/api/v1/health']
            interval: 10s
            timeout: 5s
            retries: 5

    postgres:
        image: docker.io/library/postgres:15-alpine
        restart: unless-stopped
        env_file:
            - ghostfolio.env
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -d "$${POSTGRES_DB}" -U $${POSTGRES_USER}']
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - postgres:/var/lib/postgresql/data

    redis:
        image: docker.io/library/redis:alpine
        restart: unless-stopped
        env_file:
            - ghostfolio.env
        command:
            - /bin/sh
            - -c
            - redis-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}"
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli --pass "$${REDIS_PASSWORD}" ping | grep PONG']
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres:
